AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lab starting environment
Parameters:
  IncidentDbPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Lab starting environment
  StudentId:
    Type: String
    AllowedPattern: "[a-z0-9-]+"
  LabRoleArn:
    Type: String
    Default: ""
  LatestAmi:
    Type: String
    AllowedPattern: "^ami-[0-9a-f]{8,17}$"
    ConstraintDescription: "Supply a valid parameter value."
Conditions:
  HasLabRoleArn: !Not [!Equals [!Ref 'LabRoleArn', ""]]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: mediops-vpc}]
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties: {Tags: [{Key: Name, Value: mediops-igw}]}
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref 'Vpc', InternetGatewayId: !Ref 'Igw'}
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: mediops-public-1a}]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.40.2.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: mediops-public-1b}]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: mediops-private-1a}]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.40.12.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: mediops-private-1b}]
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt 'NatEip.AllocationId'
      SubnetId: !Ref 'PublicSubnet1'
      Tags: [{Key: Name, Value: mediops-nat}]
  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'Vpc'
      Tags: [{Key: Name, Value: mediops-public-rt}]
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref 'PublicRt'
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref 'Igw'
  PubAssoc1: {Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: {RouteTableId: !Ref 'PublicRt',
      SubnetId: !Ref 'PublicSubnet1'}}
  PubAssoc2: {Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: {RouteTableId: !Ref 'PublicRt',
      SubnetId: !Ref 'PublicSubnet2'}}
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'Vpc'
      Tags: [{Key: Name, Value: mediops-private-rt}]
  PrivateDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref 'PrivateRt'
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref 'Igw'
  PrivAssoc1: {Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: {RouteTableId: !Ref 'PrivateRt',
      SubnetId: !Ref 'PrivateSubnet1'}}
  PrivAssoc2: {Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: {RouteTableId: !Ref 'PrivateRt',
      SubnetId: !Ref 'PrivateSubnet2'}}
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lab starting environment
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: mediops-alb-sg}]
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lab starting environment
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0}
      - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: mediops-app-sg}]
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lab starting environment
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: mediops-db-sg}]
  DbPasswordParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mediops/db_password
      Type: String
      Value: !Ref 'IncidentDbPassword'
      Description: "Lab starting environment"
  DbHostParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mediops/db_host
      Type: String
      Value: "placeholder.internal"
  AppPortParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mediops/app_port
      Type: String
      Value: "3000"
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "mediops-docs-${StudentId}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags: [{Key: Name, Value: mediops-docs}]
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: mediops-db-subnet-group
      DBSubnetGroupDescription: private subnets
      SubnetIds: [!Ref 'PrivateSubnet1', !Ref 'PrivateSubnet2']
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: mediops-db
      Engine: postgres
      EngineVersion: "15.16"
      DBInstanceClass: db.t3.small
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: mediops
      MasterUsername: mediops_admin
      MasterUserPassword: !Ref 'IncidentDbPassword'
      DBSubnetGroupName: !Ref 'DbSubnetGroup'
      VPCSecurityGroups: [!Ref 'DbSg']
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      Tags: [{Key: Name, Value: mediops-db}]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mediops-tg
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref 'Vpc'
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mediops-alb
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref 'PublicSubnet1', !Ref 'PublicSubnet2']
      SecurityGroups: [!Ref 'AlbSg']
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref 'Alb'
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref 'TargetGroup'}]
  LogsEndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lab starting environment
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref 'AppSg'}
      SecurityGroupEgress:
      - {IpProtocol: "-1", CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: mediops-vpce-sg}]
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref 'Vpc'
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref 'PrivateSubnet1', !Ref 'PrivateSubnet2']
      SecurityGroupIds: [!Ref 'LogsEndpointSg']
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: mediops-cluster}
  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mediops-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !If [HasLabRoleArn, !Ref 'LabRoleArn', !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      TaskRoleArn: !If [HasLabRoleArn, !Ref 'LabRoleArn', !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      ContainerDefinitions:
      - Name: web
        Image: "public.ecr.aws/nginx/nginx:latest"
        Command:
        - /bin/sh
        - -c
        - "printf 'server { listen 3000; location = /health { return 200 ok; } location\
          \ / { return 200 portal; } } ' > /etc/nginx/conf.d/default.conf && exec\
          \ nginx -g 'daemon off;'"
        PortMappings: [{ContainerPort: 80, Protocol: tcp}]
        Environment:
        - {Name: APP_PORT, Value: ""}
        - {Name: DB_HOST, Value: ""}
        - {Name: DB_SECRET_ARN, Value: ""}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'LogGroup'
            awslogs-region: !Ref "AWS::Region"
            awslogs-stream-prefix: app
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/mediops
      RetentionInDays: 7
  Service:
    Type: AWS::ECS::Service
    DependsOn:
    - HttpListener
    - LogGroup
    Properties:
      ServiceName: mediops-service
      Cluster: !Ref 'EcsCluster'
      TaskDefinition: !Ref 'TaskDef'
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref 'PrivateSubnet1', !Ref 'PrivateSubnet2']
          SecurityGroups: [!Ref 'AppSg']
          AssignPublicIp: DISABLED
      LoadBalancers:
      - {ContainerName: web, ContainerPort: 80, TargetGroupArn: !Ref 'TargetGroup'}
  ParamCacheHost:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /mediops/cache_host
      Type: String
      Value: "internal-cache.local"
      Description: "Lab starting environment"
  SpareVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 8
      VolumeType: gp3
      Encrypted: false
      Tags:
      - {Key: Name, Value: mediops-spare-scratch}
  NoiseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /mediops/noise-app
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: mediops-alerts
      DisplayName: MediOps Alerts
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: mediops-jobs-queue
      MessageRetentionPeriod: 345600
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: mediops-lt
      LaunchTemplateData:
        ImageId: !Ref 'LatestAmi'
        InstanceType: t3.small
        SecurityGroupIds: [!Ref 'AppSg']
        IamInstanceProfile:
          Name: LabInstanceProfile
        UserData:
          Fn::Base64: |
            #!/bin/bash
            cat >/opt/mediops-web.py <<'PY'
            from http.server import BaseHTTPRequestHandler, HTTPServer
            class H(BaseHTTPRequestHandler):
                def do_GET(self):
                    body = b'ok' if self.path.startswith('/health') else b'MediOps portal'
                    self.send_response(200)
                    self.send_header('Content-Type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(body)
                def log_message(self, *a):
                    pass
            HTTPServer(('0.0.0.0', 3000), H).serve_forever()
            PY
            nohup python3 /opt/mediops-web.py >/var/log/mediops-web.log 2>&1 &
  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: mediops-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref 'LaunchTemplate'
        Version: !GetAtt 'LaunchTemplate.LatestVersionNumber'
      VPCZoneIdentifier: [!Ref 'PrivateSubnet1', !Ref 'PrivateSubnet2']
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
      - {Key: Name, Value: mediops-asg-instance, PropagateAtLaunch: true}
Outputs:
  AlbUrl:
    Description: Lab starting environment
    Value: !Sub "http://${Alb.DNSName}"
  IncidentSummary:
    Description: Lab starting environment
    Value: "Read MediOps_Jam_Module.md - 12 open tickets across 4 tracks"
  StackName:
    Value: !Ref 'AWS::StackName'
